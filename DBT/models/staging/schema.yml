version: 2

sources:
  - name: staging
    database: database
    schema: Indego_project
    tables:
      - name: indego_trips_all

models:
  - name: stg_tripdata
    description: >
      Indego trip data are publicly available datasets from Indego, Philadelphia’s bike-share system. 
      It contains bikeshare trip data in Philadelphia from 2023 to 2024. 
    columns:
      - name: trip_id
        description: Primary key for this table, locally unique integer that identifies the trip
        tests:
          - unique
          - not_null

      - name: duration
        description: Length of trip in minutes
        tests:
          - not_null

      - name: start_time
        description: Raw trip start time string in local time (MM/DD/YYYY HH:MM)
        tests:
          - not_null

      - name: end_time
        description: Raw trip end time string in local time (MM/DD/YYYY HH:MM)
        tests:
          - not_null

      - name: start_ts
        description: >
          Trip start time parsed once as a TIMESTAMP using SAFE.PARSE_TIMESTAMP.
          Uses the existing parser's default UTC convention, without local timezone conversion.
          Invalid strings become NULL and fail the not_null test.
        data_type: timestamp
        tests:
          - not_null

      - name: end_ts
        description: >
          Trip end time parsed once as a TIMESTAMP using SAFE.PARSE_TIMESTAMP.
          Uses the same timezone convention as start_ts.
          Invalid strings become NULL and fail the not_null test.
        data_type: timestamp
        tests:
          - not_null

      - name: start_station
        description: The station ID where the trip originated
        tests:
          - not_null

      - name: start_lat
        description: The latitude of the station where the trip originated

      - name: start_lon
        description: The longitude of the station where the trip originated

      - name: end_station
        description: The station ID where the trip terminated
        tests:
          - not_null

      - name: end_lat
        description: The latitude of the station where the trip terminated

      - name: end_lon
        description: The longitude of the station where the trip terminated
